version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /services/compliance
      - /services/gateway
      - /services/gateway/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /services/payments
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/fraud
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /services/compliance
      - /services/fraud
      - /services/gateway
      - /services/payments
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
