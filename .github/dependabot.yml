version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /services/compliance
      - /services/gateway
      - /services/gateway/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Type definitions follow the Node version the services run on (22 LTS), not run ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /services/payments
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Spring Boot 4 does not compile against this code yet (Jackson 3 moved its packages).
      # Remove this once the payments service has been migrated.
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /services/fraud
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /services/compliance
      - /services/fraud
      - /services/gateway
      - /services/payments
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Stay on LTS runtimes: Node 22, Java 21. Move up by hand when you choose to.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Postgres 18 stores its data in a different directory, so the volume mount has to change first.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # The tests start their own Redis through Testcontainers, so CI never exercises this image.
      # Only scripts/smoke.sh does. Move up by hand after running it against the new version.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
