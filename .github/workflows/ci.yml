name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  payments:
    name: payments (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The tests start real Postgres and Redis through Testcontainers, so they need a reachable Docker
      # daemon. Show what this runner has, so a failure here can be read straight from the log.
      - name: Show the Docker on this runner
        working-directory: .
        run: docker version
      # Newer Docker engines refuse the old API version Testcontainers 1.x asks for by default, which
      # makes it report "could not find a valid Docker environment". Ask for a version they accept.
      - name: Let Testcontainers talk to a current Docker engine
        working-directory: .
        run: echo "api.version=1.44" > ~/.docker-java.properties
      - run: ./gradlew test

  fraud:
    name: fraud (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fraud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/fraud/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  compliance:
    name: compliance (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/compliance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/compliance/package-lock.json
      - run: npm ci
      - run: npm test

  gateway:
    name: gateway (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/gateway/package-lock.json
            services/gateway/web/package-lock.json
      - run: npm ci
      - run: npm test
      # The React website is built here too, so a type error in it fails the pull request.
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  # The one required check on main. Branch protection names this job, so adding or renaming a service
  # above never leaves a required check waiting for a status that will not arrive.
  ci:
    name: ci
    if: always()
    needs: [payments, fraud, compliance, gateway]
    runs-on: ubuntu-latest
    steps:
      - name: Every service passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
