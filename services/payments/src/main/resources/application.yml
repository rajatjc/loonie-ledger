server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: payments
  datasource:
    # DATABASE_URL wins; Render supplies the parts separately because it cannot build a JDBC URL.
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:payments}}
    username: ${DATABASE_USER:loonie}
    password: ${DATABASE_PASSWORD:loonie}
    hikari:
      maximum-pool-size: 8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

loonie:
  admin-token: ${ADMIN_TOKEN:dev-admin-token}
  consumer-name: ${CONSUMER_NAME:payments-1}
